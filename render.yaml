services:
  - type: web
    name: agentise-mega-crm
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm test
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Agentise Mega CRM
      - key: PORT
        value: 3000
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PIX_CHAVE
        sync: false
      - key: PIX_BENEFICIARIO
        sync: false
      - key: PIX_CIDADE
        value: SAO PAULO
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
